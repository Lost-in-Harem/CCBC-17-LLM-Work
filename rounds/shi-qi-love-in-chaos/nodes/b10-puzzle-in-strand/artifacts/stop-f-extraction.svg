<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <style>
    .title { font: 700 26px sans-serif; fill: #1f2937; }
    .subtitle { font: 16px sans-serif; fill: #374151; }
    .strand { stroke: #4b5563; stroke-width: 7; fill: none; }
    .circle { stroke: #374151; stroke-width: 5; fill: #fff; }
    .double { stroke: #c2410c; stroke-width: 7; fill: #ffedd5; }
    .pair { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 7 6; }
    .base { font: 700 24px monospace; text-anchor: middle; dominant-baseline: central; fill: #111827; }
    .dir { font: 700 20px monospace; text-anchor: middle; fill: #4b5563; }
    .board { font: 14px sans-serif; text-anchor: middle; fill: #6b7280; }
    .read { font: 700 22px monospace; fill: #111827; }
    .accent { fill: #c2410c; }
    .arrow { stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="50" y="42" class="title">REJECTED STOP/F hypothesis: two matches per gap</text>
  <text x="50" y="70" class="subtitle">Hint-12 order: 2, 6, 7, 8, 4, 5, 3, 1. First strand is written top-to-bottom; later strands may reverse.</text>

  <!-- solid strand backbones -->
  <g class="strand">
    <path d="M100 120 L100 390"/><path d="M240 120 L240 390"/>
    <path d="M380 120 L380 390"/><path d="M520 120 L520 390"/>
    <path d="M660 120 L660 390"/><path d="M800 120 L800 390"/>
    <path d="M940 120 L940 390"/><path d="M1080 120 L1080 390"/>
  </g>

  <!-- Watson-Crick matches: exactly two at every gap -->
  <g class="pair">
    <path d="M128 210 L212 210"/><path d="M128 300 L212 300"/>
    <path d="M268 300 L352 300"/><path d="M268 390 L352 390"/>
    <path d="M408 120 L492 120"/><path d="M408 390 L492 390"/>
    <path d="M548 210 L632 210"/><path d="M548 300 L632 300"/>
    <path d="M688 210 L772 210"/><path d="M688 300 L772 300"/>
    <path d="M828 120 L912 120"/><path d="M828 210 L912 210"/>
    <path d="M968 120 L1052 120"/><path d="M968 390 L1052 390"/>
  </g>

  <!-- circles -->
  <g>
    <circle class="circle" cx="100" cy="120" r="28"/><circle class="circle" cx="100" cy="210" r="28"/><circle class="circle" cx="100" cy="300" r="28"/><circle class="circle" cx="100" cy="390" r="28"/>
    <circle class="circle" cx="240" cy="120" r="28"/><circle class="circle" cx="240" cy="210" r="28"/><circle class="double" cx="240" cy="300" r="28"/><circle class="circle" cx="240" cy="390" r="28"/>
    <circle class="circle" cx="380" cy="120" r="28"/><circle class="circle" cx="380" cy="210" r="28"/><circle class="circle" cx="380" cy="300" r="28"/><circle class="double" cx="380" cy="390" r="28"/>
    <circle class="circle" cx="520" cy="120" r="28"/><circle class="circle" cx="520" cy="210" r="28"/><circle class="circle" cx="520" cy="300" r="28"/><circle class="circle" cx="520" cy="390" r="28"/>
    <circle class="circle" cx="660" cy="120" r="28"/><circle class="double" cx="660" cy="210" r="28"/><circle class="double" cx="660" cy="300" r="28"/><circle class="circle" cx="660" cy="390" r="28"/>
    <circle class="circle" cx="800" cy="120" r="28"/><circle class="double" cx="800" cy="210" r="28"/><circle class="circle" cx="800" cy="300" r="28"/><circle class="circle" cx="800" cy="390" r="28"/>
    <circle class="double" cx="940" cy="120" r="28"/><circle class="circle" cx="940" cy="210" r="28"/><circle class="circle" cx="940" cy="300" r="28"/><circle class="circle" cx="940" cy="390" r="28"/>
    <circle class="circle" cx="1080" cy="120" r="28"/><circle class="circle" cx="1080" cy="210" r="28"/><circle class="circle" cx="1080" cy="300" r="28"/><circle class="circle" cx="1080" cy="390" r="28"/>
  </g>

  <!-- bases -->
  <g class="base">
    <text x="100" y="120">A</text><text x="100" y="210">T</text><text x="100" y="300">A</text><text x="100" y="390">T</text>
    <text x="240" y="120">G</text><text x="240" y="210">A</text><text x="240" y="300">T</text><text x="240" y="390">T</text>
    <text x="380" y="120">A</text><text x="380" y="210">C</text><text x="380" y="300">A</text><text x="380" y="390">A</text>
    <text x="520" y="120">T</text><text x="520" y="210">T</text><text x="520" y="300">A</text><text x="520" y="390">T</text>
    <text x="660" y="120">T</text><text x="660" y="210">A</text><text x="660" y="300">T</text><text x="660" y="390">C</text>
    <text x="800" y="120">G</text><text x="800" y="210">T</text><text x="800" y="300">A</text><text x="800" y="390">C</text>
    <text x="940" y="120">C</text><text x="940" y="210">A</text><text x="940" y="300">G</text><text x="940" y="390">T</text>
    <text x="1080" y="120">G</text><text x="1080" y="210">A</text><text x="1080" y="300">G</text><text x="1080" y="390">A</text>
  </g>

  <g>
    <text class="dir" x="100" y="445">F</text><text class="dir" x="240" y="445">F</text><text class="dir" x="380" y="445">R</text><text class="dir" x="520" y="445">R</text>
    <text class="dir" x="660" y="445">R</text><text class="dir" x="800" y="445">R</text><text class="dir" x="940" y="445">F</text><text class="dir" x="1080" y="445">R</text>
    <text class="board" x="100" y="470">Board 2</text><text class="board" x="240" y="470">Board 6</text><text class="board" x="380" y="470">Board 7</text><text class="board" x="520" y="470">Board 8</text>
    <text class="board" x="660" y="470">Board 4</text><text class="board" x="800" y="470">Board 5</text><text class="board" x="940" y="470">Board 3</text><text class="board" x="1080" y="470">Board 1</text>
  </g>

  <text x="70" y="520" class="subtitle">Orange circles are matched to both neighbours:</text>
  <text x="420" y="520" class="read accent">T / A / - / AT / T / C = TAATTC</text>
  <line x1="765" y1="515" x2="850" y2="515" class="arrow"/>
  <text x="870" y="520" class="read">TAA | TTC</text>
  <text x="420" y="565" class="read">STOP | F</text>
  <line x1="570" y1="560" x2="655" y2="560" class="arrow"/>
  <text x="675" y="565" class="read">MINI | F | YHAVE</text>
  <line x1="935" y1="560" x2="1015" y2="560" class="arrow"/>
  <text x="1035" y="565" class="read accent">MINI</text>

  <text x="70" y="620" class="subtitle">Blue dashed lines: complementary same-row pairs. Orange circles: the literal double overlaps used for extraction.</text>
</svg>
