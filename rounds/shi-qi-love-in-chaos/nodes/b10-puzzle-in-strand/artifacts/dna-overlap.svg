<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <rect width="1280" height="620" fill="#fffaf2"/>
  <style>
    .title { font: 700 24px system-ui, sans-serif; fill: #202124; }
    .board { font: 700 15px system-ui, sans-serif; fill: #454b52; }
    .code { font: 700 23px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #111; }
    .pair { font: 700 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #4c5662; }
    .base { font: 800 24px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #fff; }
    .note { font: 15px system-ui, sans-serif; fill: #444; }
    .strong { font: 700 20px system-ui, sans-serif; fill: #1f5d3b; }
    .answer { font: 800 34px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #8f2525; }
    .duplex { font: 700 19px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #333; }
    .card { fill: #fff; stroke: #27313a; stroke-width: 2; rx: 12; }
    .link { stroke: #6e7781; stroke-width: 3; stroke-dasharray: 8 7; }
    .chip { fill: #287a4b; rx: 10; }
    .empty { fill: #d8dde3; rx: 10; }
  </style>

  <text x="640" y="38" text-anchor="middle" class="title">REJECTED ROUTE: DNA overlap / EcoRI</text>

  <g>
    <rect class="card" x="20" y="70" width="110" height="82"/><text class="board" x="75" y="94" text-anchor="middle">Board 4</text><text class="code" x="75" y="127" text-anchor="middle">FLON</text>
    <rect class="card" x="180" y="70" width="110" height="82"/><text class="board" x="235" y="94" text-anchor="middle">Board 2</text><text class="code" x="235" y="127" text-anchor="middle">BION</text>
    <rect class="card" x="340" y="70" width="110" height="82"/><text class="board" x="395" y="94" text-anchor="middle">Board 5</text><text class="code" x="395" y="127" text-anchor="middle">INNG</text>
    <rect class="card" x="500" y="70" width="110" height="82"/><text class="board" x="555" y="94" text-anchor="middle">Board 1</text><text class="code" x="555" y="127" text-anchor="middle">APNG</text>
    <rect class="card" x="660" y="70" width="110" height="82"/><text class="board" x="715" y="94" text-anchor="middle">Board 7</text><text class="code" x="715" y="127" text-anchor="middle">PASM</text>
    <rect class="card" x="820" y="70" width="110" height="82"/><text class="board" x="875" y="94" text-anchor="middle">Board 3</text><text class="code" x="875" y="127" text-anchor="middle">CAST</text>
    <rect class="card" x="980" y="70" width="110" height="82"/><text class="board" x="1035" y="94" text-anchor="middle">Board 8</text><text class="code" x="1035" y="127" text-anchor="middle">STER</text>
    <rect class="card" x="1140" y="70" width="110" height="82"/><text class="board" x="1195" y="94" text-anchor="middle">Board 6</text><text class="code" x="1195" y="127" text-anchor="middle">NETY</text>

    <line class="link" x1="130" y1="111" x2="180" y2="111"/><text class="pair" x="155" y="94" text-anchor="middle">NO</text>
    <line class="link" x1="290" y1="111" x2="340" y2="111"/><text class="pair" x="315" y="94" text-anchor="middle">IN</text>
    <line class="link" x1="450" y1="111" x2="500" y2="111"/><text class="pair" x="475" y="94" text-anchor="middle">GN</text>
    <line class="link" x1="610" y1="111" x2="660" y2="111"/><text class="pair" x="635" y="94" text-anchor="middle">AP</text>
    <line class="link" x1="770" y1="111" x2="820" y2="111"/><text class="pair" x="795" y="94" text-anchor="middle">AS</text>
    <line class="link" x1="930" y1="111" x2="980" y2="111"/><text class="pair" x="955" y="94" text-anchor="middle">ST</text>
    <line class="link" x1="1090" y1="111" x2="1140" y2="111"/><text class="pair" x="1115" y="94" text-anchor="middle">ET</text>
  </g>

  <text x="35" y="205" class="note">DNA bases at the seven overlaps (A/C/G/T only):</text>
  <g>
    <rect class="empty" x="130" y="220" width="50" height="42"/><text class="base" x="155" y="241" text-anchor="middle">-</text>
    <rect class="empty" x="290" y="220" width="50" height="42"/><text class="base" x="315" y="241" text-anchor="middle">-</text>
    <rect class="chip" x="450" y="220" width="50" height="42"/><text class="base" x="475" y="241" text-anchor="middle">G</text>
    <rect class="chip" x="610" y="220" width="50" height="42"/><text class="base" x="635" y="241" text-anchor="middle">A</text>
    <rect class="chip" x="770" y="220" width="50" height="42"/><text class="base" x="795" y="241" text-anchor="middle">A</text>
    <rect class="chip" x="930" y="220" width="50" height="42"/><text class="base" x="955" y="241" text-anchor="middle">T</text>
    <rect class="chip" x="1090" y="220" width="50" height="42"/><text class="base" x="1115" y="241" text-anchor="middle">T</text>
  </g>
  <text x="640" y="300" text-anchor="middle" class="strong">overlap bases: GAATT</text>

  <text x="50" y="355" class="note">edge trails + terminal residue:</text>
  <text x="285" y="355" class="pair">PASTE ING ON FL</text>
  <text x="650" y="355" class="strong">FLING -&gt; CAST -&gt; C</text>
  <text x="50" y="405" class="note">complete the reverse-complement DNA site:</text>
  <text x="525" y="405" class="duplex">5'-GAATT C-3'   /   3'-CTTAA G-5'</text>
  <text x="640" y="475" text-anchor="middle" class="strong">Rejected: EcoRI cuts G^AATTC; this is only an unsupported continuation</text>
  <text x="640" y="535" text-anchor="middle" class="answer">REJECTED: ECORI</text>
</svg>
