<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#fffaf2"/>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #20242b; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; font-weight: 600; fill: #46505c; }
    .letter { font: 700 25px Consolas, monospace; text-anchor: middle; dominant-baseline: middle; }
    .code { font: 700 23px Consolas, monospace; }
    .note { font-size: 16px; fill: #4a5058; }
    .answer { font: 800 36px Consolas, monospace; fill: #8f2525; }
    .node { fill: #fff; stroke: #27313a; stroke-width: 3; }
    .pasted { fill: #dff4e7; stroke: #287a4b; stroke-width: 4; }
    .path { fill: #fff2cc; stroke: #b06b00; stroke-width: 4; }
    .strand { fill: none; stroke: #59636e; stroke-width: 4; }
    .match { stroke: #7c8792; stroke-width: 4; stroke-dasharray: 8 7; }
    .changed { stroke: #b12a2a; stroke-width: 5; }
    .arrow { fill: none; stroke: #287a4b; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287a4b"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">PASTE ING ON FL</text>
  <text x="270" y="82" text-anchor="middle" class="subtitle">Before: Board 4 beside Board 2</text>
  <text x="825" y="82" text-anchor="middle" class="subtitle">After pasting the three-circle segment</text>

  <!-- Before -->
  <path class="strand" d="M210 115 L210 385 M330 115 L330 385"/>
  <line class="match" x1="240" y1="285" x2="300" y2="285"/>
  <line class="match" x1="240" y1="365" x2="300" y2="365"/>
  <g>
    <circle class="node" cx="210" cy="125" r="29"/><text class="letter" x="210" y="125">F</text>
    <circle class="node" cx="210" cy="205" r="29"/><text class="letter" x="210" y="205">L</text>
    <circle class="node" cx="210" cy="285" r="29"/><text class="letter" x="210" y="285">N</text>
    <circle class="node" cx="210" cy="365" r="29"/><text class="letter" x="210" y="365">O</text>
    <circle class="node" cx="330" cy="125" r="29"/><text class="letter" x="330" y="125">B</text>
    <circle class="node" cx="330" cy="205" r="29"/><text class="letter" x="330" y="205">I</text>
    <circle class="node" cx="330" cy="285" r="29"/><text class="letter" x="330" y="285">N</text>
    <circle class="node" cx="330" cy="365" r="29"/><text class="letter" x="330" y="365">O</text>
  </g>
  <text x="180" y="430" class="code">FLNO</text>
  <text x="300" y="430" class="code">BINO</text>
  <text x="270" y="462" text-anchor="middle" class="note">The x2 pairs are N/N and O/O.</text>

  <!-- Paste source -->
  <text x="505" y="190" text-anchor="middle" class="code">I</text>
  <text x="505" y="235" text-anchor="middle" class="code">N</text>
  <text x="505" y="280" text-anchor="middle" class="code">G</text>
  <path class="arrow" d="M475 300 C430 330 425 185 405 165"/>
  <text x="505" y="320" text-anchor="middle" class="note">Align I/N on F/L;</text>
  <text x="505" y="344" text-anchor="middle" class="note">G lands on the old N.</text>

  <!-- After -->
  <path class="strand" d="M760 115 L760 385 M880 115 L880 385"/>
  <line class="changed" x1="790" y1="285" x2="850" y2="285"/>
  <line class="match" x1="790" y1="365" x2="850" y2="365"/>
  <g>
    <circle class="pasted" cx="760" cy="125" r="29"/><text class="letter" x="760" y="125">I</text>
    <circle class="pasted" cx="760" cy="205" r="29"/><text class="letter" x="760" y="205">N</text>
    <circle class="path" cx="760" cy="285" r="29"/><text class="letter" x="760" y="285">G</text>
    <circle class="path" cx="760" cy="365" r="29"/><text class="letter" x="760" y="365">O</text>
    <circle class="path" cx="880" cy="125" r="29"/><text class="letter" x="880" y="125">B</text>
    <circle class="path" cx="880" cy="205" r="29"/><text class="letter" x="880" y="205">I</text>
    <circle class="path" cx="880" cy="285" r="29"/><text class="letter" x="880" y="285">N</text>
    <circle class="node" cx="880" cy="365" r="29"/><text class="letter" x="880" y="365">O</text>
  </g>
  <text x="730" y="430" class="code">INGO</text>
  <text x="850" y="430" class="code">BINO</text>
  <text x="825" y="462" text-anchor="middle" class="note">Read B-I-N, cross the changed N/G pairing, then G-O.</text>

  <text x="550" y="535" text-anchor="middle" class="code">B I N  +  G O</text>
  <text x="550" y="600" text-anchor="middle" class="answer">ANSWER CANDIDATE: BINGO</text>
</svg>
