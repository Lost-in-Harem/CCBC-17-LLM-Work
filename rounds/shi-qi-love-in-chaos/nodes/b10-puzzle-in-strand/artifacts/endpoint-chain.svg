<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="430" viewBox="0 0 1140 430">
  <rect width="1140" height="430" fill="#fffaf2"/>
  <style>
    .title { font: 700 22px system-ui, sans-serif; fill: #222; }
    .board { font: 600 15px system-ui, sans-serif; fill: #555; }
    .letter { font: 700 20px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; fill: #111; }
    .strand { fill: none; stroke: #282828; stroke-width: 5; stroke-linecap: round; }
    .node { fill: #fff; stroke: #282828; stroke-width: 4; }
    .plain { stroke: #8a96a3; stroke-width: 4; opacity: .85; }
    .cross { stroke: #d43f3a; stroke-width: 6; opacity: .9; }
    .note { font: 600 17px system-ui, sans-serif; text-anchor: middle; fill: #b32925; }
    .caption { font: 14px system-ui, sans-serif; fill: #444; }
  </style>

  <text x="570" y="32" text-anchor="middle" class="title">A rejected crossing read: PASTE</text>

  <!-- Matching-letter connectors. Red pairs are forced to cross. -->
  <g fill="none" stroke-linecap="round">
    <line class="plain" x1="70" y1="240" x2="210" y2="240"/>
    <line class="plain" x1="70" y1="310" x2="210" y2="310"/>

    <line class="plain" x1="210" y1="170" x2="350" y2="100"/>
    <line class="plain" x1="210" y1="240" x2="350" y2="170"/>

    <line class="plain" x1="350" y1="240" x2="490" y2="240"/>
    <line class="plain" x1="350" y1="310" x2="490" y2="310"/>

    <line class="cross" x1="490" y1="100" x2="630" y2="170"/>
    <line class="cross" x1="490" y1="170" x2="630" y2="100"/>

    <line class="plain" x1="630" y1="170" x2="770" y2="170"/>
    <line class="plain" x1="630" y1="310" x2="770" y2="310"/>

    <line class="cross" x1="770" y1="240" x2="910" y2="170"/>
    <line class="cross" x1="770" y1="310" x2="910" y2="100"/>

    <line class="cross" x1="910" y1="170" x2="1050" y2="310"/>
    <line class="cross" x1="910" y1="310" x2="1050" y2="170"/>
  </g>

  <!-- The eight four-letter strands in their unique order. -->
  <g>
    <text x="70" y="65" class="board" text-anchor="middle">B4 · FLNO</text>
    <path class="strand" d="M70 100 L70 310"/>
    <circle class="node" cx="70" cy="100" r="23"/><text class="letter" x="70" y="100">F</text>
    <circle class="node" cx="70" cy="170" r="23"/><text class="letter" x="70" y="170">L</text>
    <circle class="node" cx="70" cy="240" r="23"/><text class="letter" x="70" y="240">N</text>
    <circle class="node" cx="70" cy="310" r="23"/><text class="letter" x="70" y="310">O</text>

    <text x="210" y="65" class="board" text-anchor="middle">B2 · BINO</text>
    <path class="strand" d="M210 100 L210 310"/>
    <circle class="node" cx="210" cy="100" r="23"/><text class="letter" x="210" y="100">B</text>
    <circle class="node" cx="210" cy="170" r="23"/><text class="letter" x="210" y="170">I</text>
    <circle class="node" cx="210" cy="240" r="23"/><text class="letter" x="210" y="240">N</text>
    <circle class="node" cx="210" cy="310" r="23"/><text class="letter" x="210" y="310">O</text>

    <text x="350" y="65" class="board" text-anchor="middle">B5 · INGN</text>
    <path class="strand" d="M350 100 L350 310"/>
    <circle class="node" cx="350" cy="100" r="23"/><text class="letter" x="350" y="100">I</text>
    <circle class="node" cx="350" cy="170" r="23"/><text class="letter" x="350" y="170">N</text>
    <circle class="node" cx="350" cy="240" r="23"/><text class="letter" x="350" y="240">G</text>
    <circle class="node" cx="350" cy="310" r="23"/><text class="letter" x="350" y="310">N</text>

    <text x="490" y="65" class="board" text-anchor="middle">B1 · APGN</text>
    <path class="strand" d="M490 100 L490 310"/>
    <circle class="node" cx="490" cy="100" r="23"/><text class="letter" x="490" y="100">A</text>
    <circle class="node" cx="490" cy="170" r="23"/><text class="letter" x="490" y="170">P</text>
    <circle class="node" cx="490" cy="240" r="23"/><text class="letter" x="490" y="240">G</text>
    <circle class="node" cx="490" cy="310" r="23"/><text class="letter" x="490" y="310">N</text>

    <text x="630" y="65" class="board" text-anchor="middle">B7 · PAMS</text>
    <path class="strand" d="M630 100 L630 310"/>
    <circle class="node" cx="630" cy="100" r="23"/><text class="letter" x="630" y="100">P</text>
    <circle class="node" cx="630" cy="170" r="23"/><text class="letter" x="630" y="170">A</text>
    <circle class="node" cx="630" cy="240" r="23"/><text class="letter" x="630" y="240">M</text>
    <circle class="node" cx="630" cy="310" r="23"/><text class="letter" x="630" y="310">S</text>

    <text x="770" y="65" class="board" text-anchor="middle">B3 · CATS</text>
    <path class="strand" d="M770 100 L770 310"/>
    <circle class="node" cx="770" cy="100" r="23"/><text class="letter" x="770" y="100">C</text>
    <circle class="node" cx="770" cy="170" r="23"/><text class="letter" x="770" y="170">A</text>
    <circle class="node" cx="770" cy="240" r="23"/><text class="letter" x="770" y="240">T</text>
    <circle class="node" cx="770" cy="310" r="23"/><text class="letter" x="770" y="310">S</text>

    <text x="910" y="65" class="board" text-anchor="middle">B8 · STRE</text>
    <path class="strand" d="M910 100 L910 310"/>
    <circle class="node" cx="910" cy="100" r="23"/><text class="letter" x="910" y="100">S</text>
    <circle class="node" cx="910" cy="170" r="23"/><text class="letter" x="910" y="170">T</text>
    <circle class="node" cx="910" cy="240" r="23"/><text class="letter" x="910" y="240">R</text>
    <circle class="node" cx="910" cy="310" r="23"/><text class="letter" x="910" y="310">E</text>

    <text x="1050" y="65" class="board" text-anchor="middle">B6 · NEYT</text>
    <path class="strand" d="M1050 100 L1050 310"/>
    <circle class="node" cx="1050" cy="100" r="23"/><text class="letter" x="1050" y="100">N</text>
    <circle class="node" cx="1050" cy="170" r="23"/><text class="letter" x="1050" y="170">E</text>
    <circle class="node" cx="1050" cy="240" r="23"/><text class="letter" x="1050" y="240">Y</text>
    <circle class="node" cx="1050" cy="310" r="23"/><text class="letter" x="1050" y="310">T</text>
  </g>

  <text x="560" y="365" class="note">P–A</text>
  <text x="930" y="365" class="note">S–T–E</text>
  <text x="570" y="404" text-anchor="middle" class="caption">PASTE and the unsupported completion PASTEUR were both rejected; this diagram is negative evidence only.</text>
</svg>
