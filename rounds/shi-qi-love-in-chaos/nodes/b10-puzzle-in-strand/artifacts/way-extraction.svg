<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .title { font: 700 28px system-ui, sans-serif; fill: #172033; }
    .sub { font: 16px system-ui, sans-serif; fill: #475569; }
    .label { font: 700 17px system-ui, sans-serif; fill: #334155; }
    .mono { font: 700 21px ui-monospace, monospace; fill: #172033; text-anchor: middle; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .dna { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .protein { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .pair { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .answer { font: 800 42px ui-monospace, monospace; fill: #b91c1c; text-anchor: middle; text-decoration: line-through; }
    .rejected { font: 800 18px system-ui, sans-serif; fill: #ffffff; text-anchor: middle; }
    .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="48" y="45" class="title">Rejected extraction: WAY</text>
  <text x="48" y="74" class="sub">User-rejected on 2026-08-30; the whole weak/strong seven-bit ASCII → WY completion family is stopped.</text>
  <rect x="995" y="24" width="150" height="42" rx="9" fill="#b91c1c"/>
  <text x="1070" y="51" class="rejected">REJECTED</text>

  <rect class="dna" x="55" y="110" width="1090" height="78" rx="12"/>
  <text x="600" y="139" class="label" text-anchor="middle">Keep A/C/G/T from the eight spangrams</text>
  <text x="600" y="169" class="mono">AT / GATT / AACA / TATT / CTAT / CATG / CAGT / AG</text>

  <path class="arrow" d="M370 188 L370 230"/>
  <path class="arrow" d="M830 188 L830 230"/>

  <rect class="protein" x="55" y="240" width="530" height="188" rx="12"/>
  <text x="320" y="271" class="label" text-anchor="middle">Codon / protein read</text>
  <text x="320" y="306" class="small">Fill the four-circle endpoint strands; start at the first ATG</text>
  <text x="320" y="344" class="mono">ATG ATT AAC ATA TTC TAT CAT GCA GTA GAG</text>
  <text x="320" y="382" class="mono">M I N I F Y  H A V E</text>
  <text x="320" y="413" class="small">instruction: MINIFY HAVE</text>

  <rect class="pair" x="615" y="240" width="530" height="188" rx="12"/>
  <text x="880" y="271" class="label" text-anchor="middle">Fourteen Watson–Crick bonds</text>
  <text x="880" y="306" class="small">28 original bases = 7 gaps × 2 bonds × 2 endpoints</text>
  <text x="880" y="344" class="mono">WWWSWWW | WSWWSSW</text>
  <text x="880" y="382" class="mono">1110111 | 1011001</text>
  <text x="880" y="413" class="small">seven-bit ASCII: w / Y → outer frame W…Y</text>

  <path class="arrow" d="M320 428 L320 482"/>
  <path class="arrow" d="M880 428 L880 482"/>

  <rect class="box" x="55" y="492" width="530" height="80" rx="12"/>
  <text x="320" y="523" class="label" text-anchor="middle">Reuse the same life-letter minification</text>
  <text x="320" y="557" class="mono">HAVE → A</text>

  <rect class="box" x="615" y="492" width="530" height="80" rx="12"/>
  <text x="880" y="523" class="label" text-anchor="middle">Put the one retained base in the decoded gap</text>
  <text x="880" y="557" class="mono">W + A + Y</text>

  <path class="arrow" d="M600 572 L600 600"/>
  <text x="600" y="636" class="answer">WAY</text>
  <text x="1000" y="627" class="small">semantic coincidence only</text>
</svg>
