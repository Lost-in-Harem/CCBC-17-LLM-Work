<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
  <style>
    .title { font: 700 25px sans-serif; fill: #172033; }
    .label { font: 700 17px monospace; fill: #172033; }
    .small { font: 15px sans-serif; fill: #475569; }
    .bit { font: 700 22px monospace; fill: #172033; }
    .circle { stroke: #172033; stroke-width: 3; }
    .marked { fill: #f6c453; }
    .plain { fill: #ffffff; }
    .gap { stroke: #7c879b; stroke-width: 2; stroke-dasharray: 7 7; }
  </style>
  <rect width="1240" height="520" fill="#fbf4e7"/>
  <text x="620" y="42" text-anchor="middle" class="title">REJECTED B10 route — arbitrary top row gives 0101010₂ = 42</text>
  <text x="76" y="83" class="small">Unique order:</text>
  <text x="210" y="83" class="label">4       2       5       1       7       3       8       6</text>

  <!-- Columns: FLNO BINO INGN APGN PAMS CATS STRE NEYT.  The first column is
       the anchor; later columns mark their two letters shared with the left. -->
  <g transform="translate(185 120)">
    <line x1="70" y1="65" x2="110" y2="65" class="gap"/><line x1="205" y1="65" x2="245" y2="65" class="gap"/>
    <line x1="340" y1="65" x2="380" y2="65" class="gap"/><line x1="475" y1="65" x2="515" y2="65" class="gap"/>
    <line x1="610" y1="65" x2="650" y2="65" class="gap"/><line x1="745" y1="65" x2="785" y2="65" class="gap"/>
    <line x1="880" y1="65" x2="920" y2="65" class="gap"/>

    <!-- board 4 anchor -->
    <g transform="translate(20 0)"><circle cx="25" cy="25" r="23" class="circle plain"/><circle cx="25" cy="95" r="23" class="circle plain"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle plain"/><text x="25" y="31" text-anchor="middle" class="label">F</text><text x="25" y="101" text-anchor="middle" class="label">L</text><text x="25" y="171" text-anchor="middle" class="label">N</text><text x="25" y="241" text-anchor="middle" class="label">O</text><text x="25" y="287" text-anchor="middle" class="label">FLNO</text></g>
    <!-- board 2: NO -->
    <g transform="translate(155 0)"><circle cx="25" cy="25" r="23" class="circle plain"/><circle cx="25" cy="95" r="23" class="circle plain"/><circle cx="25" cy="165" r="23" class="circle marked"/><circle cx="25" cy="235" r="23" class="circle marked"/><text x="25" y="31" text-anchor="middle" class="label">B</text><text x="25" y="101" text-anchor="middle" class="label">I</text><text x="25" y="171" text-anchor="middle" class="label">N</text><text x="25" y="241" text-anchor="middle" class="label">O</text><text x="25" y="287" text-anchor="middle" class="label">BINO</text><text x="25" y="330" text-anchor="middle" class="bit">0</text></g>
    <!-- board 5: IN, choose the lower N; top bit unaffected -->
    <g transform="translate(290 0)"><circle cx="25" cy="25" r="23" class="circle marked"/><circle cx="25" cy="95" r="23" class="circle plain"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle marked"/><text x="25" y="31" text-anchor="middle" class="label">I</text><text x="25" y="101" text-anchor="middle" class="label">N</text><text x="25" y="171" text-anchor="middle" class="label">G</text><text x="25" y="241" text-anchor="middle" class="label">N</text><text x="25" y="287" text-anchor="middle" class="label">INGN</text><text x="25" y="330" text-anchor="middle" class="bit">1</text></g>
    <!-- board 1: GN -->
    <g transform="translate(425 0)"><circle cx="25" cy="25" r="23" class="circle plain"/><circle cx="25" cy="95" r="23" class="circle plain"/><circle cx="25" cy="165" r="23" class="circle marked"/><circle cx="25" cy="235" r="23" class="circle marked"/><text x="25" y="31" text-anchor="middle" class="label">A</text><text x="25" y="101" text-anchor="middle" class="label">P</text><text x="25" y="171" text-anchor="middle" class="label">G</text><text x="25" y="241" text-anchor="middle" class="label">N</text><text x="25" y="287" text-anchor="middle" class="label">APGN</text><text x="25" y="330" text-anchor="middle" class="bit">0</text></g>
    <!-- board 7: AP -->
    <g transform="translate(560 0)"><circle cx="25" cy="25" r="23" class="circle marked"/><circle cx="25" cy="95" r="23" class="circle marked"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle plain"/><text x="25" y="31" text-anchor="middle" class="label">P</text><text x="25" y="101" text-anchor="middle" class="label">A</text><text x="25" y="171" text-anchor="middle" class="label">M</text><text x="25" y="241" text-anchor="middle" class="label">S</text><text x="25" y="287" text-anchor="middle" class="label">PAMS</text><text x="25" y="330" text-anchor="middle" class="bit">1</text></g>
    <!-- board 3: AS -->
    <g transform="translate(695 0)"><circle cx="25" cy="25" r="23" class="circle plain"/><circle cx="25" cy="95" r="23" class="circle marked"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle marked"/><text x="25" y="31" text-anchor="middle" class="label">C</text><text x="25" y="101" text-anchor="middle" class="label">A</text><text x="25" y="171" text-anchor="middle" class="label">T</text><text x="25" y="241" text-anchor="middle" class="label">S</text><text x="25" y="287" text-anchor="middle" class="label">CATS</text><text x="25" y="330" text-anchor="middle" class="bit">0</text></g>
    <!-- board 8: ST -->
    <g transform="translate(830 0)"><circle cx="25" cy="25" r="23" class="circle marked"/><circle cx="25" cy="95" r="23" class="circle marked"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle plain"/><text x="25" y="31" text-anchor="middle" class="label">S</text><text x="25" y="101" text-anchor="middle" class="label">T</text><text x="25" y="171" text-anchor="middle" class="label">R</text><text x="25" y="241" text-anchor="middle" class="label">E</text><text x="25" y="287" text-anchor="middle" class="label">STRE</text><text x="25" y="330" text-anchor="middle" class="bit">1</text></g>
    <!-- board 6: ET -->
    <g transform="translate(965 0)"><circle cx="25" cy="25" r="23" class="circle plain"/><circle cx="25" cy="95" r="23" class="circle marked"/><circle cx="25" cy="165" r="23" class="circle plain"/><circle cx="25" cy="235" r="23" class="circle marked"/><text x="25" y="31" text-anchor="middle" class="label">N</text><text x="25" y="101" text-anchor="middle" class="label">E</text><text x="25" y="171" text-anchor="middle" class="label">Y</text><text x="25" y="241" text-anchor="middle" class="label">T</text><text x="25" y="287" text-anchor="middle" class="label">NEYT</text><text x="25" y="330" text-anchor="middle" class="bit">0</text></g>
  </g>
  <text x="620" y="488" text-anchor="middle" class="title">REJECTED: 0 1 0 1 0 1 0 (base 2) = 42</text>
</svg>
